<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nile Craft Furniture | Links</title>
    <meta
      name="description"
      content="Nile Craft Furniture social links: Facebook, Instagram, and TikTok."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest-900: #071a16;
        --forest-700: #0d352c;
        --forest-500: #145143;
        --forest-900-rgb: 7, 26, 22;
        --forest-700-rgb: 13, 53, 44;
        --forest-500-rgb: 20, 81, 67;
        --gold-300: #e6d3a0;
        --gold-400: #d9bf83;
        --gold-500: #bda269;
        --gold-300-rgb: 230, 211, 160;
        --gold-400-rgb: 217, 191, 131;
        --cream: #f6f0de;
        --cream-rgb: 246, 240, 222;
        --shadow: rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Outfit", sans-serif;
        color: var(--cream);
        background:
          radial-gradient(1200px 600px at 8% 10%, rgba(var(--gold-300-rgb), 0.14), transparent 60%),
          radial-gradient(1000px 700px at 92% 90%, rgba(var(--gold-400-rgb), 0.12), transparent 60%),
          linear-gradient(145deg, var(--forest-900), var(--forest-700) 55%, var(--forest-500));
        display: grid;
        place-items: center;
        padding: 20px;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.02) 0 2px,
            transparent 2px 12px
          );
        opacity: 0.35;
      }

      .card {
        width: min(680px, 100%);
        border-radius: 28px;
        border: 1px solid rgba(var(--gold-300-rgb), 0.28);
        background:
          linear-gradient(165deg, rgba(var(--gold-300-rgb), 0.08), rgba(var(--forest-900-rgb), 0.65)),
          linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.45));
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        overflow: hidden;
      }

      .hero {
        position: relative;
        height: 240px;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.6)),
          url("assets/hero.jpg") center / cover no-repeat;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          70% 120% at 50% 0%,
          rgba(var(--gold-300-rgb), 0.16),
          transparent 70%
        );
      }

      .content {
        position: relative;
        padding: 0 24px 28px;
      }

      .logo-wrap {
        margin-top: -64px;
        display: flex;
        justify-content: center;
      }

      .logo-frame {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        border: 3px solid var(--gold-300);
        background: linear-gradient(160deg, var(--forest-900), var(--forest-500));
        box-shadow:
          0 12px 35px var(--shadow),
          0 0 0 8px rgba(var(--gold-300-rgb), 0.08);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .logo-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .logo-fallback {
        font-family: "Cinzel", serif;
        font-size: 2rem;
        letter-spacing: 0.04em;
        color: var(--gold-300);
      }

      h1 {
        margin: 14px 0 2px;
        text-align: center;
        font-family: "Cinzel", serif;
        font-weight: 700;
        font-size: clamp(1.8rem, 5.2vw, 2.75rem);
        color: var(--gold-300);
      }

      .tagline {
        margin: 0 0 16px;
        text-align: center;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold-400);
        font-size: clamp(0.72rem, 2vw, 0.9rem);
      }

      .links {
        display: grid;
        gap: 12px;
      }

      .link-btn {
        text-decoration: none;
        color: var(--cream);
        border-radius: 16px;
        border: 1px solid rgba(var(--gold-300-rgb), 0.34);
        background:
          linear-gradient(90deg, rgba(var(--gold-300-rgb), 0.09), rgba(var(--gold-300-rgb), 0.01)),
          rgba(var(--forest-700-rgb), 0.82);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      }

      .link-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon {
        width: 22px;
        height: 22px;
        color: var(--gold-300);
        flex: 0 0 auto;
      }

      .icon-stack {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
      }

      .icon-img {
        display: none;
        width: 22px;
        height: 22px;
        object-fit: contain;
        border-radius: 4px;
      }

      .icon-fallback {
        display: block;
      }

      .label {
        font-size: 1rem;
        font-weight: 600;
      }

      .arrow {
        color: var(--gold-400);
        font-size: 1.05rem;
      }

      .link-btn:hover,
      .link-btn:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(var(--gold-300-rgb), 0.75);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
        outline: none;
      }

      .footer {
        margin-top: 20px;
        text-align: center;
        color: rgba(var(--cream-rgb), 0.78);
        font-size: 0.82rem;
      }

      .reveal {
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.55s ease forwards;
      }

      .delay-1 {
        animation-delay: 0.08s;
      }
      .delay-2 {
        animation-delay: 0.16s;
      }
      .delay-3 {
        animation-delay: 0.24s;
      }
      .delay-4 {
        animation-delay: 0.32s;
      }

      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 12px;
        }

        .card {
          width: 100%;
          border-radius: 22px;
        }

        .hero {
          height: 170px;
        }

        .content {
          padding: 0 14px 18px;
        }

        .logo-frame {
          width: 96px;
          height: 96px;
        }

        h1 {
          margin-top: 12px;
          font-size: clamp(1.55rem, 8vw, 2rem);
        }

        .tagline {
          margin-bottom: 14px;
          letter-spacing: 0.16em;
        }

        .links {
          gap: 10px;
        }

        .link-btn {
          min-height: 52px;
          padding: 12px 14px;
          border-radius: 14px;
        }

        .label {
          font-size: 0.96rem;
        }

        .arrow {
          font-size: 0.92rem;
        }

        .footer {
          margin-top: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="hero" aria-hidden="true"></header>

      <section class="content">
        <div class="logo-wrap reveal">
          <div class="logo-frame">
            <img
              src="./Nile_craft_circle_border_visible_transparent.png"
              alt="Nile Craft Furniture logo"
              id="brandLogo"
              loading="eager"
              decoding="async"
            />
            <span class="logo-fallback" id="logoFallback">NC</span>
          </div>
        </div>

        <h1 class="reveal delay-1">Nile Craft Furniture</h1>
        <p class="tagline reveal delay-2">Official Social Links</p>

        <nav class="links" aria-label="Social links">
          <a
            class="link-btn reveal delay-2"
            href="https://www.facebook.com/profile.php?id=61586960456155"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-left">
              <span class="icon-stack">
                <img
                  class="icon-img"
                  id="facebookIcon"
                  src="assets/facebook.png"
                  alt=""
                  loading="lazy"
                  decoding="async"
                />
                <svg class="icon icon-fallback" id="facebookIconFallback" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.6 1.7-1.6h1.5V3.8c-.3 0-1.2-.1-2.4-.1-2.4 0-4 1.5-4 4.2V10H8v3h2.3v8h3.2z"
                  />
                </svg>
              </span>
              <span class="label">Facebook</span>
            </span>
            <span class="arrow">Open</span>
          </a>

          <a
            class="link-btn reveal delay-3"
            href="https://www.instagram.com/nile.craft.furniture/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-left">
              <span class="icon-stack">
                <img
                  class="icon-img"
                  id="instagramIcon"
                  src="assets/instagram.png"
                  alt=""
                  loading="lazy"
                  decoding="async"
                />
                <svg class="icon icon-fallback" id="instagramIconFallback" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" stroke="currentColor" stroke-width="2" />
                  <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
                  <circle cx="17.5" cy="6.5" r="1.3" fill="currentColor" />
                </svg>
              </span>
              <span class="label">Instagram</span>
            </span>
            <span class="arrow">Open</span>
          </a>

          <a
            class="link-btn reveal delay-4"
            href="https://www.tiktok.com/@nilecraftfurniture?lang=en-GB"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-left">
              <span class="icon-stack">
                <img
                  class="icon-img"
                  id="tiktokIcon"
                  src="assets/tiktok.png"
                  alt=""
                  loading="lazy"
                  decoding="async"
                />
                <svg class="icon icon-fallback" id="tiktokIconFallback" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M18.2 7.2c-1.4-.1-2.5-.9-3.1-2.1V15a4.7 4.7 0 1 1-4.7-4.7c.2 0 .5 0 .7.1v2.4a2.3 2.3 0 1 0 1.6 2.2V3h2.4c.2 1.9 1.4 3 3.1 3.4v.8z"
                  />
                </svg>
              </span>
              <span class="label">TikTok</span>
            </span>
            <span class="arrow">Open</span>
          </a>
        </nav>

        <p class="footer reveal delay-4">Nile Craft Furniture</p>
      </section>
    </main>

    <script>
      const assetRoots = [".", "assets", "Asset"];
      const imageExts = ["png", "jpg", "jpeg", "webp"];

      function resolveCandidates(fileName, exts) {
        const dot = fileName.lastIndexOf(".");
        const baseName = dot > 0 ? fileName.slice(0, dot) : fileName;
        const defaultExt = dot > 0 ? fileName.slice(dot + 1).toLowerCase() : null;
        const extensionSet = defaultExt ? [defaultExt, ...exts.filter((ext) => ext !== defaultExt)] : exts;
        const baseVariants = Array.from(
          new Set([
            baseName,
            baseName.toLowerCase(),
            baseName.charAt(0).toUpperCase() + baseName.slice(1).toLowerCase()
          ])
        );
        const candidates = [];

        assetRoots.forEach((root) => {
          baseVariants.forEach((base) => {
            extensionSet.forEach((ext) => {
              candidates.push(`${root}/${base}.${ext}`);
            });
          });
        });

        return candidates;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function hexToRgbTuple(hex) {
        const normalized = hex.replace("#", "");
        const fullHex =
          normalized.length === 3
            ? normalized
                .split("")
                .map((char) => char + char)
                .join("")
            : normalized;
        const int = Number.parseInt(fullHex, 16);
        const r = (int >> 16) & 255;
        const g = (int >> 8) & 255;
        const b = int & 255;
        return `${r}, ${g}, ${b}`;
      }

      function rgbToHsl(r, g, b) {
        const rn = r / 255;
        const gn = g / 255;
        const bn = b / 255;
        const max = Math.max(rn, gn, bn);
        const min = Math.min(rn, gn, bn);
        const delta = max - min;
        let h = 0;
        let s = 0;
        const l = (max + min) / 2;

        if (delta !== 0) {
          s = delta / (1 - Math.abs(2 * l - 1));
          if (max === rn) h = ((gn - bn) / delta) % 6;
          else if (max === gn) h = (bn - rn) / delta + 2;
          else h = (rn - gn) / delta + 4;
          h = (h * 60 + 360) % 360;
        }

        return [h, s, l];
      }

      function hslToRgb(h, s, l) {
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = l - c / 2;
        let rn = 0;
        let gn = 0;
        let bn = 0;

        if (h >= 0 && h < 60) {
          rn = c;
          gn = x;
        } else if (h < 120) {
          rn = x;
          gn = c;
        } else if (h < 180) {
          gn = c;
          bn = x;
        } else if (h < 240) {
          gn = x;
          bn = c;
        } else if (h < 300) {
          rn = x;
          bn = c;
        } else {
          rn = c;
          bn = x;
        }

        return [
          Math.round((rn + m) * 255),
          Math.round((gn + m) * 255),
          Math.round((bn + m) * 255)
        ];
      }

      function hslToHex(h, s, l) {
        const [r, g, b] = hslToRgb(h, s, l);
        return (
          "#" +
          [r, g, b]
            .map((value) => value.toString(16).padStart(2, "0"))
            .join("")
        );
      }

      function applyThemeFromLogo(image) {
        try {
          const canvas = document.createElement("canvas");
          const size = 96;
          canvas.width = size;
          canvas.height = size;
          const context = canvas.getContext("2d", { willReadFrequently: true });
          if (!context) return;

          context.clearRect(0, 0, size, size);
          context.drawImage(image, 0, 0, size, size);

          const pixels = context.getImageData(0, 0, size, size).data;
          let allR = 0;
          let allG = 0;
          let allB = 0;
          let allCount = 0;

          let darkR = 0;
          let darkG = 0;
          let darkB = 0;
          let darkCount = 0;

          let accentR = 0;
          let accentG = 0;
          let accentB = 0;
          let accentCount = 0;

          for (let i = 0; i < pixels.length; i += 4) {
            const alpha = pixels[i + 3] / 255;
            if (alpha < 0.2) continue;

            const r = pixels[i];
            const g = pixels[i + 1];
            const b = pixels[i + 2];
            const [h, s, l] = rgbToHsl(r, g, b);

            if (l > 0.96 && s < 0.08) continue;

            allR += r;
            allG += g;
            allB += b;
            allCount += 1;

            if (l < 0.42) {
              darkR += r;
              darkG += g;
              darkB += b;
              darkCount += 1;
            }

            if (s > 0.18 && l > 0.18 && l < 0.82) {
              accentR += r;
              accentG += g;
              accentB += b;
              accentCount += 1;
            }
          }

          if (!allCount) return;

          const avgAll = [allR / allCount, allG / allCount, allB / allCount];
          const avgDark =
            darkCount > 0
              ? [darkR / darkCount, darkG / darkCount, darkB / darkCount]
              : [avgAll[0] * 0.45, avgAll[1] * 0.45, avgAll[2] * 0.45];
          const avgAccent =
            accentCount > 0
              ? [accentR / accentCount, accentG / accentCount, accentB / accentCount]
              : avgAll;

          const [accentH, accentSRaw, accentLRaw] = rgbToHsl(avgAccent[0], avgAccent[1], avgAccent[2]);
          const accentS = clamp(Math.max(accentSRaw, 0.28), 0.28, 0.85);
          const accentL = clamp(Math.max(accentLRaw, 0.56), 0.48, 0.78);

          const [darkHRaw, darkSRaw, darkLRaw] = rgbToHsl(avgDark[0], avgDark[1], avgDark[2]);
          const hue = darkSRaw > 0.08 ? darkHRaw : accentH;
          const darkS = clamp(Math.max(darkSRaw, 0.32), 0.24, 0.78);
          const darkL = clamp(Math.min(darkLRaw, 0.2), 0.07, 0.24);

          const forest900 = hslToHex(hue, darkS, darkL);
          const forest700 = hslToHex(hue, clamp(darkS * 0.95, 0.22, 0.74), clamp(darkL + 0.09, 0.14, 0.34));
          const forest500 = hslToHex(hue, clamp(darkS * 0.9, 0.2, 0.68), clamp(darkL + 0.18, 0.24, 0.46));

          const gold300 = hslToHex(accentH, accentS, accentL);
          const gold400 = hslToHex(
            accentH,
            clamp(accentS * 0.9, 0.22, 0.75),
            clamp(accentL - 0.12, 0.36, 0.68)
          );
          const gold500 = hslToHex(
            accentH,
            clamp(accentS * 0.8, 0.2, 0.7),
            clamp(accentL - 0.24, 0.26, 0.58)
          );
          const cream = hslToHex(accentH, clamp(accentS * 0.2, 0.06, 0.22), 0.92);

          const root = document.documentElement;
          root.style.setProperty("--forest-900", forest900);
          root.style.setProperty("--forest-700", forest700);
          root.style.setProperty("--forest-500", forest500);
          root.style.setProperty("--forest-900-rgb", hexToRgbTuple(forest900));
          root.style.setProperty("--forest-700-rgb", hexToRgbTuple(forest700));
          root.style.setProperty("--forest-500-rgb", hexToRgbTuple(forest500));
          root.style.setProperty("--gold-300", gold300);
          root.style.setProperty("--gold-400", gold400);
          root.style.setProperty("--gold-500", gold500);
          root.style.setProperty("--gold-300-rgb", hexToRgbTuple(gold300));
          root.style.setProperty("--gold-400-rgb", hexToRgbTuple(gold400));
          root.style.setProperty("--cream", cream);
          root.style.setProperty("--cream-rgb", hexToRgbTuple(cream));
        } catch (error) {
          console.error("Theme extraction failed:", error);
        }
      }

      function bindImageWithFallback(imageId, fallbackId, fileNames, exts = imageExts, onLoad = null) {
        const image = document.getElementById(imageId);
        const fallback = document.getElementById(fallbackId);
        if (!image) return;

        if (fallback) fallback.style.display = "";

        const names = Array.isArray(fileNames) ? fileNames : [fileNames];
        const candidates = names.flatMap((fileName) => resolveCandidates(fileName, exts));
        let idx = 0;

        const tryNext = () => {
          if (idx >= candidates.length) {
            image.style.display = "none";
            if (fallback) fallback.style.display = "";
            return;
          }
          image.src = candidates[idx];
          idx += 1;
        };

        image.addEventListener("load", () => {
          image.style.display = "block";
          if (fallback) fallback.style.display = "none";
          if (typeof onLoad === "function") onLoad(image);
        });

        image.addEventListener("error", tryNext);
        tryNext();
      }

      bindImageWithFallback(
        "brandLogo",
        "logoFallback",
        ["Nile_craft_circle_border_visible_transparent.png", "logo.png"],
        imageExts,
        applyThemeFromLogo
      );
      bindImageWithFallback("facebookIcon", "facebookIconFallback", "facebook.png");
      bindImageWithFallback("instagramIcon", "instagramIconFallback", "instagram.png");
      bindImageWithFallback("tiktokIcon", "tiktokIconFallback", "tiktok.png");

      (function bindHero() {
        const hero = document.querySelector(".hero");
        if (!hero) return;

        const candidates = resolveCandidates("hero.jpg", imageExts);
        let idx = 0;

        const tryNext = () => {
          if (idx >= candidates.length) {
            hero.style.background =
              "linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.6)), linear-gradient(140deg, var(--forest-500), var(--forest-900))";
            return;
          }
          const src = candidates[idx];
          idx += 1;

          const probe = new Image();
          probe.onload = () => {
            hero.style.background =
              `linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.6)), url("${src}") center / cover no-repeat`;
          };
          probe.onerror = tryNext;
          probe.src = src;
        };

        tryNext();
      })();
    </script>
  </body>
</html>
